<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(155deg,#ffe6ee,#f3e8ff);color:#63364f;min-height:100dvh;overflow:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #c63b88;outline-offset:3px}button.primary{border:0;border-radius:16px;padding:13px 17px;background:#f27fa9;color:white;font-weight:800}button.secondary{border:2px solid #f3bdd3;border-radius:16px;padding:10px 14px;background:white;color:#af517c;font-weight:750}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:22px 17px;overflow:auto}.hidden{display:none!important}h1{font-size:34px;letter-spacing:-.7px;text-align:center;margin:17px 0 4px}p{line-height:1.55;text-align:center}.panel{width:min(100%,420px);background:#ffffffd5;border:1px solid white;border-radius:25px;padding:18px;box-shadow:0 12px 36px #dd7ca527}.group-label{font-weight:800;margin:15px 0 8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{padding:11px 5px;border:2px solid #f8ccdc;border-radius:15px;background:white;color:#70425d;font-weight:750;min-height:79px}.choice.selected{border-color:#ed5a98;background:#ffe1ee}.choice span{display:block;font-size:31px;line-height:40px}.choice img{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 2px}.start{display:block;width:100%;margin-top:19px;font-size:18px}.topbar{display:flex;justify-content:space-between;width:100%;align-items:center;font-size:18px;font-weight:850;z-index:5;position:relative;pointer-events:none}#game{overflow:hidden;background:linear-gradient(#fff1f6,#f9e9ff);padding:19px}#arena{position:absolute;inset:68px 0 76px;overflow:hidden;touch-action:manipulation}.target{--size:clamp(94px,25vw,116px);position:absolute;display:grid;place-items:center;width:var(--size);height:var(--size);padding:0;border:0;background:transparent;cursor:pointer;user-select:none;touch-action:manipulation;appearance:none;animation:popin .25s ease-out both;isolation:isolate}.target img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 5px #9b6c8555);pointer-events:none}.target.caught{pointer-events:none;animation:none}.face-layer{position:absolute;inset:0;display:grid;place-items:center;animation:facegone .92s ease-in forwards}.face-layer img{width:100%;height:100%;object-fit:contain}.effect-layer{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;animation:fxgone .92s ease-in forwards}.mark{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-10deg);font-size:clamp(44px,13vw,60px);line-height:1;opacity:.57;filter:drop-shadow(0 1px 3px #ffffff88)}.effect-layer.kiss .mark{transform:translate(-50%,-50%) rotate(-18deg);opacity:.62}.effect-layer.hug .mark{opacity:.52}.effect-layer.paw .mark{font-size:49px;opacity:.55}.effect-layer.slap .mark{transform:translate(-50%,-50%) rotate(-23deg);opacity:.62}.effect-layer.bonk .mark{opacity:.58;top:43%}.hammer{position:absolute;left:44%;top:-50%;font-size:66px;transform-origin:73% 80%;line-height:1;filter:drop-shadow(0 2px 1px #ffffff8a);animation:hammerhit .65s cubic-bezier(.23,.78,.23,1) both;z-index:5;opacity:.88}.stars{position:absolute;left:49%;top:23%;font-size:32px;opacity:0;animation:starburst .75s ease-out forwards}.target.bonked .face-layer{animation:shakefade .92s ease-out forwards}.sparkle{position:absolute;font-size:22px;opacity:0;animation:starburst .8s ease-out forwards}.sparkle.a{left:11%;top:17%}.sparkle.b{right:8%;top:20%;animation-delay:.06s}.sparkle.c{right:30%;bottom:10%;animation-delay:.12s}.game-footer{position:absolute;bottom:22px;z-index:7}.finish{justify-content:center}.finish .panel{text-align:center}.finish p{font-size:19px}.subtitle{margin:5px 0 17px}
@keyframes popin{from{transform:scale(.45);opacity:0}to{transform:scale(1);opacity:1}}@keyframes facegone{0%,45%{opacity:1;transform:scale(1)}65%{opacity:.9;transform:scale(.98)}82%{opacity:.46;transform:scale(.93)}100%{opacity:0;transform:scale(.85)}}@keyframes fxgone{0%{opacity:0}12%,32%{opacity:1}65%{opacity:.57}100%{opacity:0}}@keyframes shakefade{0%,14%{transform:translateX(0) rotate(0);opacity:1}24%{transform:translateX(-7px) rotate(-7deg);opacity:1}32%{transform:translateX(7px) rotate(7deg);opacity:.94}42%{transform:translateX(-4px) rotate(-4deg);opacity:.8}100%{transform:translateX(0) scale(.83);opacity:0}}@keyframes hammerhit{0%{transform:translate(-45px,-42px) rotate(-66deg);opacity:0}12%{opacity:.9}37%{transform:translate(-4px,34px) rotate(17deg)}48%{transform:translate(-3px,30px) rotate(28deg)}65%{transform:translate(-32px,-6px) rotate(-35deg);opacity:.9}100%{transform:translate(-46px,-25px) rotate(-49deg);opacity:0}}@keyframes starburst{0%,29%{opacity:0;transform:translateY(6px) scale(.3)}45%{opacity:.88;transform:translateY(-5px) scale(1.2)}100%{opacity:0;transform:translateY(-22px) scale(.7)}}
@media(max-height:660px){.screen#setup{padding-top:7px}h1{margin:6px 0 0}.subtitle{margin:4px 0 8px}.choice{min-height:66px;padding:6px}.choice img{width:43px;height:43px}.choice span{font-size:27px;line-height:32px}.group-label{margin:8px 0 5px}.start{margin-top:11px}}

/* On catch, restart face opacity at 100% even if a target was already fading. */
.target.caught .face-layer{animation:catchClearThenFade .92s ease-out both}
@keyframes catchClearThenFade{0%,58%{opacity:1;transform:scale(1)}72%{opacity:.92;transform:scale(.98)}86%{opacity:.46;transform:scale(.93)}100%{opacity:0;transform:scale(.85)}}
/* Slap and Bonk keep their own impact-shake animations, which override this rule. */
/* Cartoon handprint and flying tears: no stars in Slap. */
.effect-layer.slap .slap-print{position:absolute;width:66%;height:69%;left:40%;top:24%;overflow:visible;opacity:.78;filter:drop-shadow(0 1px 2px #d7587340);animation:handprintReveal .92s ease-out both}
.effect-layer.slap .tear{position:absolute;width:22%;height:33%;left:8%;top:24%;opacity:0;transform-origin:center;animation:tearFlyLeft .9s cubic-bezier(.18,.72,.2,1) both}
.effect-layer.slap .tear-two{left:22%;top:15%;width:15%;height:24%;animation:tearFlyUp .9s cubic-bezier(.18,.72,.2,1) both}
.target.slapped .face-layer{animation:slapShakeFade .92s ease-out both}
.target.bonked .face-layer{animation:bonkShakeFade .92s ease-out both}
@keyframes handprintReveal{0%,10%{opacity:0;transform:scale(.72) rotate(-15deg)}22%{opacity:.9;transform:scale(1.08) rotate(4deg)}40%{opacity:.78;transform:scale(1)}70%{opacity:.55}100%{opacity:0}}
@keyframes tearFlyLeft{0%,15%{opacity:0;transform:translate(20px,6px) scale(.4) rotate(58deg)}28%{opacity:.9;transform:translate(0,0) scale(1) rotate(58deg)}65%{opacity:.75;transform:translate(-32px,35px) rotate(58deg)}100%{opacity:0;transform:translate(-68px,74px) scale(.7) rotate(58deg)}}
@keyframes tearFlyUp{0%,19%{opacity:0;transform:translate(15px,15px) scale(.35)}31%{opacity:.86;transform:translate(0,0) scale(1) rotate(58deg)}70%{opacity:.7;transform:translate(-29px,39px) rotate(58deg)}100%{opacity:0;transform:translate(-60px,81px) scale(.7) rotate(58deg)}}
@keyframes slapShakeFade{0%,14%{transform:translateX(0) rotate(0);opacity:1}21%{transform:translateX(9px) rotate(9deg);opacity:1}29%{transform:translateX(-8px) rotate(-7deg);opacity:1}38%{transform:translateX(5px) rotate(4deg);opacity:1}48%{transform:translateX(-2px) rotate(-2deg);opacity:1}58%{transform:translateX(0);opacity:1}76%{opacity:.75}100%{transform:translateX(0) scale(.85);opacity:0}}
@keyframes bonkShakeFade{0%,24%{transform:translate(0,0) rotate(0);opacity:1}31%{transform:translate(-7px,6px) rotate(-8deg);opacity:1}39%{transform:translate(7px,-2px) rotate(7deg);opacity:1}47%{transform:translate(-5px,2px) rotate(-4deg);opacity:1}57%{transform:translate(2px,0) rotate(2deg);opacity:1}70%{opacity:.96}100%{transform:translate(0,0) scale(.83);opacity:0}}

/* iPhone viewport: entire setup fits without vertical scrolling. */
html,body{width:100%;height:100%;height:100svh;margin:0;overflow:hidden;overscroll-behavior:none}
body{min-height:0;position:fixed;inset:0}
.screen{height:100%;height:100svh;min-height:0;overflow:hidden;padding:clamp(7px,2.0svh,18px) 13px max(8px,env(safe-area-inset-bottom));justify-content:center}
#setup h1{font-size:clamp(23px,4.5svh,32px);margin:0 0 2px;line-height:1.13}
#setup .subtitle{font-size:clamp(11px,1.8svh,14px);line-height:1.22;margin:3px 0 clamp(5px,1.1svh,12px)}
#setup .panel{padding:clamp(8px,1.6svh,15px);border-radius:20px;flex-shrink:1}
#setup .group-label{font-size:clamp(11px,1.9svh,14px);margin:clamp(5px,.9svh,10px) 0 clamp(3px,.65svh,6px)}
#setup .choices{gap:clamp(4px,.9svh,9px)}
#setup .choice{min-height:0;padding:clamp(4px,.7svh,7px) 3px;border-radius:12px;font-size:clamp(10px,1.8svh,13px);line-height:1.12}
#setup .choice img{width:clamp(27px,5.5svh,45px);height:clamp(27px,5.5svh,45px);margin:0 auto 2px}
#setup .choice span{font-size:clamp(21px,4.5svh,32px);line-height:1.14;margin-bottom:3px}
#setup .start{padding:clamp(8px,1.5svh,12px);margin-top:clamp(7px,1.4svh,13px);font-size:clamp(13px,2.2svh,17px)}
#game{padding:max(13px,env(safe-area-inset-top)) 13px max(13px,env(safe-area-inset-bottom))}
#arena{top:clamp(55px,9svh,72px);bottom:clamp(65px,11svh,90px)}
#end{padding:18px}
#end h1{font-size:clamp(24px,5svh,34px)}
button{touch-action:manipulation}
@media(max-height:540px){#setup .panel{padding:6px 10px}#setup .choice img{width:26px;height:26px}#setup .group-label{margin:3px 0}#setup .choice{padding:3px}#setup .start{margin-top:5px;padding:7px}#setup .subtitle{margin:2px 0 5px}}

const $=s=>document.querySelector(s);
for(const who of ['lumi','beth','hayden']){$('#'+who+'-choice').src=photos[who];}
let chosen='lumi',effect='slap',score=0,seconds=30,active=false,spawnInterval=null,tickInterval=null,finishDelay=null;
const effects={slap:'🖐️',kiss:'💋',hug:'🫂',paw:'🐾',bonk:'💥'};
const rand=a=>a[Math.floor(Math.random()*a.length)];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));$('#'+id).classList.remove('hidden')}
for(const id of ['targets','effects']){document.querySelectorAll('#'+id+' button').forEach(b=>b.addEventListener('click',()=>{if(id==='targets')chosen=b.dataset.t;else effect=b.dataset.effect;document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('selected',x===b))}))}
function spawn(){if(!active || score>=10)return;const arena=$('#arena'),r=arena.getBoundingClientRect();if(r.width<120||r.height<140)return;const who=chosen==='all'?rand(['lumi','beth','hayden']):chosen;
const b=document.createElement('button');b.className='target';b.type='button';b.setAttribute('aria-label','Catch '+who);b.innerHTML='<div class="face-layer"><img alt=""></div>';b.querySelector('img').src=photos[who];
const size=Math.min(116,Math.max(94,r.width*.25));const x=Math.random()*Math.max(0,r.width-size-8)+4,y=Math.random()*Math.max(0,r.height-size-8)+4;b.style.left=x+'px';b.style.top=y+'px';arena.append(b);
const lifetime=setTimeout(()=>{if(!b.classList.contains('caught'))b.remove()},2100);
b.addEventListener('click',ev=>{ev.preventDefault();if(!active||b.classList.contains('caught'))return;clearTimeout(lifetime);b.classList.add('caught');score++;$('#score').textContent='💗 '+score+' / 10';const fx=effect==='random'?rand(Object.keys(effects)):effect;
const layer=document.createElement('div');layer.className='effect-layer '+fx;layer.innerHTML=fx==='slap'?`<svg class="slap-print" viewBox="0 0 110 110" aria-hidden="true"><g fill="#f47792" opacity=".72" transform="rotate(-17 55 56)"><ellipse cx="56" cy="70" rx="27" ry="22"/><rect x="27" y="26" width="11" height="40" rx="6"/><rect x="41" y="15" width="11" height="46" rx="6"/><rect x="55" y="12" width="11" height="49" rx="6"/><rect x="69" y="22" width="11" height="41" rx="6"/><ellipse cx="31" cy="72" rx="9" ry="17" transform="rotate(-39 31 72)"/></g></svg><svg class="tear tear-one" viewBox="0 0 32 44" aria-hidden="true"><path d="M16 1 C12 12 2 23 2 30 A14 14 0 0 0 30 30 C30 23 20 10 16 1Z" fill="#6fc9ef" opacity=".82"/><path d="M11 25Q8 33 13 36" fill="none" stroke="#e8faff" stroke-width="3" stroke-linecap="round"/></svg><svg class="tear tear-two" viewBox="0 0 32 44" aria-hidden="true"><path d="M16 1 C12 12 2 23 2 30 A14 14 0 0 0 30 30 C30 23 20 10 16 1Z" fill="#81dbf5" opacity=".76"/></svg>`:'<span class="mark">'+effects[fx]+'</span>';
if(fx==='bonk'){b.classList.add('bonked');layer.innerHTML+='<span class="hammer">🔨</span><span class="stars">⭐✨</span>';}else if(fx==='slap'){b.classList.add('slapped');}else if(fx==='kiss'||fx==='paw'||fx==='hug'){layer.innerHTML+='<span class="sparkle a">✨</span><span class="sparkle b">💗</span><span class="sparkle c">✨</span>';}
b.append(layer);setTimeout(()=>b.remove(),970);if(score===10){active=false;clearInterval(spawnInterval);clearInterval(tickInterval);finishDelay=setTimeout(()=>finish(true),1050);}});}
function begin(){clearInterval(spawnInterval);clearInterval(tickInterval);clearTimeout(finishDelay);$('#arena').replaceChildren();score=0;seconds=30;active=true;$('#score').textContent='💗 0 / 10';$('#timer').textContent='⏱ 30s';show('game');spawn();spawnInterval=setInterval(spawn,650);tickInterval=setInterval(()=>{seconds--;$('#timer').textContent='⏱ '+seconds+'s';if(seconds<=0)finish(false)},1000)}
function finish(won=score>=10){active=false;clearInterval(spawnInterval);clearInterval(tickInterval);clearTimeout(finishDelay);$('#endTitle').textContent=won?'Congrats 🎉 You caught me! 💗':'Every catch counts 💗';show('end')}
$('#start').addEventListener('click',begin);$('#again').addEventListener('click',begin);$('#settings').addEventListener('click',()=>{active=false;clearInterval(spawnInterval);clearInterval(tickInterval);clearTimeout(finishDelay);show('setup')});$('#bottom').addEventListener('click',()=>finish(false));
</script></body></html>
